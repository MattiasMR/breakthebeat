name: Deploy Supabase backend

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      LOGIN_RATE_LIMIT_SALT: ${{ secrets.LOGIN_RATE_LIMIT_SALT }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ vars.RESEND_FROM }}
      RESEND_REPLY_TO: ${{ vars.RESEND_REPLY_TO }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Link project
        run: npx --yes supabase@latest link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply migrations
        run: npx --yes supabase@latest db push --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Configure function secrets
        run: >-
          npx --yes supabase@latest secrets set
          --project-ref "$SUPABASE_PROJECT_ID"
          TURNSTILE_SECRET_KEY="$TURNSTILE_SECRET_KEY"
          LOGIN_RATE_LIMIT_SALT="$LOGIN_RATE_LIMIT_SALT"
          RESEND_API_KEY="$RESEND_API_KEY"
          RESEND_FROM="$RESEND_FROM"
          RESEND_REPLY_TO="$RESEND_REPLY_TO"
          ALLOWED_ORIGINS="$ALLOWED_ORIGINS"

      - name: Deploy functions
        run: npx --yes supabase@latest functions deploy --project-ref "$SUPABASE_PROJECT_ID" --use-api
